spring:
  application:
    name: future-pathway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:future_pathway}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway, JPA only validates
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# ── Future Pathway application settings (all overridable via env) ──
app:
  jwt:
    secret: ${JWT_SECRET:p4+8DdAafS0AV9hmZqNYiCdC9B75xWEza/OPHeeGRK1Pb7ejlclawrjNqsMVpJ9fOKtCEXUnqJX8eALZr7brbw==}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    email: ${ADMIN_EMAIL:admin@futurepathway.local}
    password: ${ADMIN_PASSWORD:Admin@123}
    name: ${ADMIN_NAME:Portal Admin}
  scheduler:
    trending-cron: ${TRENDING_CRON:0 0 2 * * *}   # daily 02:00
    reminder-cron: ${REMINDER_CRON:0 0 * * * *}    # hourly

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.futurepathway: INFO
    org.hibernate.SQL: WARN
