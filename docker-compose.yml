services:
  postgres:
    image: postgres:17-alpine
    container_name: future-pathway-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-future_pathway}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Uncomment to run the API itself in Docker (builds the fat jar first):
  # api:
  #   build: .
  #   container_name: future-pathway-api
  #   restart: unless-stopped
